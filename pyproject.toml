[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-npc-permissions"
version = "1.0.2"
description = "Allow non-operator creative players to configure NPCs"
requires-python = ">=3.10"
dependencies = [
    "endstone>=0.11.9,<0.12"
]

[project.entry-points."endstone"]
npc-permissions = "endstone_npc_permissions:NpcPermissionsPlugin"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["endstone_npc_permissions"]
